AllCops:
  NewCops: enable
  SuggestExtensions: false
  DisabledByDefault: true

N2/BooleanColumnWithIsPrefix:
  Enabled: true
  Include:
    - 'db/migrate/**/*.rb'

N2/IntegerEnumInModel:
  Enabled: true
  Include:
    - 'app/models/**/*.rb'

N2/PolicyScopeMissingInFinder:
  Enabled: true
  Include:
    - 'app/controllers/**/*.rb'

N2/MemoizationMissingInFinder:
  Enabled: true
  Include:
    - 'app/controllers/**/*.rb'

N2/BeforeActionSetX:
  Enabled: true

N2/MapToValues:
  Enabled: true

N2/HashValueShorthand:
  Enabled: true

N2/TimeNow:
  Enabled: true

N2/EnvFetchOverBracket:
  Enabled: true

N2/TimestampColumnType:
  Enabled: true
  Include:
    - 'db/migrate/**/*.rb'

N2/PluckOverMapAttribute:
  Enabled: true
